services:
  - type: web
    name: language-wall
    runtime: node
    plan: free
    # NODE_ENV is set by `pnpm start`, not here: setting it at build time would skip devDependencies (vite).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: DEV_BOTS
        value: "1"
      - key: HOP_SECONDS
        value: "45"
